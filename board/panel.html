<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF9F5">
<title>AgentOS</title>
<script data-boot>(function(){try{var p=localStorage.getItem('aos_theme');
  if(p==='light'||p==='dark')document.documentElement.setAttribute('data-theme',p)}catch(_){}})();</script>
<style>
:root{
  color-scheme:light;
  --sans:-apple-system,'PingFang SC',sans-serif;
  --serif:Georgia,'Songti SC',serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --bg:#FAF9F5;
  --rail:#F0EEE6;
  --ink:#1F1E1D;
  --dim:#6E6B63;
  --line:#E5E1D8;
  --ucard:#F0EEE6;
  --accent:#D97757;
  --accent-hi:#C4643E;
  --accent-ink:#FFFFFF;
  --accent-soft:rgba(217,119,87,.10);
  --danger:#B4442C;
  --ok:#4A7D45;
  --warn:#9C6D1E;
  --pipe1:#DDD8CB;
  --pipe2:#ECE8DD;
  --capbg:#FFFFFF;
  --card:#FFFFFF;
  --hover:#E9E6DC;
  --active:#E2DED2;
  --code:#F4F2EA;
  --danger-soft:rgba(180,68,44,.14);
  --rail-hi:#E6E3D9;
  --scrim:rgba(31,30,29,.35);
  --shadow:0 4px 16px rgba(31,30,29,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#262624;
    --rail:#1F1E1D;
    --ink:#F5F4EF;
    --dim:#A8A49B;
    --line:#3A3936;
    --ucard:#32302C;
    --accent:#D97757;
    --accent-hi:#E28A66;
    --accent-ink:#FFFFFF;
    --accent-soft:rgba(217,119,87,.16);
    --danger:#E0705A;
    --ok:#8CBE82;
    --warn:#D9A64A;
    --pipe1:#171614;
    --pipe2:#242220;
    --capbg:#211F1D;
    --card:#30302E;
    --hover:#33312D;
    --active:#3B3833;
    --code:#2C2B29;
    --danger-soft:rgba(224,112,90,.22);
    --rail-hi:#2B2A28;
    --scrim:rgba(0,0,0,.55);
    --shadow:0 4px 16px rgba(0,0,0,.35);
  }
}
/* 显式选了深色：不看系统 */
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#262624;
    --rail:#1F1E1D;
    --ink:#F5F4EF;
    --dim:#A8A49B;
    --line:#3A3936;
    --ucard:#32302C;
    --accent:#D97757;
    --accent-hi:#E28A66;
    --accent-ink:#FFFFFF;
    --accent-soft:rgba(217,119,87,.16);
    --danger:#E0705A;
    --ok:#8CBE82;
    --warn:#D9A64A;
    --pipe1:#171614;
    --pipe2:#242220;
    --capbg:#211F1D;
    --card:#30302E;
    --hover:#33312D;
    --active:#3B3833;
    --code:#2C2B29;
    --danger-soft:rgba(224,112,90,.22);
    --rail-hi:#2B2A28;
    --scrim:rgba(0,0,0,.55);
    --shadow:0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;display:flex;background:var(--bg);color:var(--ink);
 font:14px/1.6 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@keyframes breath{0%,100%{opacity:.4}50%{opacity:1}}
.live-run{animation:breath 1.8s ease-in-out infinite}
.bad{color:var(--danger)}

/* ---------- 左侧栏（对照 claude.ai 侧栏：wordmark + 两枚小图标 / + New / 按日期分组的列表） ---------- */
.rail{width:288px;flex:none;background:var(--rail);border-right:1px solid var(--line);
 display:flex;flex-direction:column;min-height:0}
.rail-top{flex:none;display:flex;align-items:center;height:40px;padding:0 10px 0 14px;gap:2px}
.wordmark{font:500 20px/1 var(--serif);letter-spacing:-.01em;color:var(--ink);flex:1;min-width:0}
.ico{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:6px;color:var(--dim)}
.ico:hover{background:var(--hover);color:var(--ink)}
.icw{display:inline-grid;place-items:center;flex:none}
.ico svg,.icw svg,.tb-ico svg,.send svg,.plusbtn svg,.tmore svg,.schev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icw svg.fil,.tmore svg.fil{fill:currentColor;stroke:none}
.newtask{flex:none;margin:10px 8px 4px;height:32px;padding:0 8px 0 10px;border-radius:8px;display:flex;align-items:center;gap:10px;
 background:var(--rail-hi);color:var(--ink);font-size:14px;width:calc(100% - 16px);text-align:left}
.newtask:hover{background:var(--hover)}
.newtask .icw svg{width:14px;height:14px;stroke-width:1.8}
.rail-find{flex:none;margin:6px 8px 0;display:none}
.rail-find.on{display:block}
.rail-find input{width:100%;height:30px;border:1px solid var(--line);border-radius:8px;padding:0 10px;
 background:var(--card);color:var(--ink);font-size:13px}
.rail-find input:focus{outline:none;border-color:var(--accent)}
.tasklist{flex:1;min-height:0;overflow-y:auto;padding:4px 8px 12px}
.t-empty{padding:14px 8px;color:var(--dim);font-size:12.5px;line-height:1.7}
.tgrp{display:flex;align-items:center;font-size:12.5px;color:var(--dim);padding:0 6px;margin:18px 0 4px;height:20px}
.tgrp:first-child{margin-top:10px}
.trow{position:relative;display:flex;align-items:center;gap:10px;height:30px;padding:0 4px 0 8px;
 border-radius:8px;cursor:pointer;margin-bottom:1px;font-size:13.5px}
.trow:hover{background:var(--hover)}
.trow.on{background:var(--rail-hi)}
.tdot{flex:none;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--dim);background:transparent}
.tdot.run{background:var(--accent);border-color:var(--accent)}
.tdot.run.live-run{animation:breath 1.8s ease-in-out infinite}
.tdot.bad{background:var(--danger);border-color:var(--danger)}
.t1t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmore{flex:none;color:var(--dim);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;visibility:hidden}
.tmore svg{width:14px;height:14px}
.trow:hover .tmore,.trow.on .tmore{visibility:visible}
.tmore:hover{background:var(--line);color:var(--ink)}
.tmenu{position:absolute;right:6px;top:30px;z-index:30;background:var(--card);
 border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:130px}
.tmi{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:7px}
.tmi:hover{background:var(--hover)}
.tmi.bad{color:var(--danger)}
.trename{width:100%;border:1px solid var(--accent);border-radius:6px;padding:2px 6px;
 background:var(--card);color:var(--ink)}
.trename:focus{outline:none}
.rail-foot{position:relative;flex:none;display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;
 border-top:1px solid var(--line);font-size:13px;color:var(--ink)}
.urow{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:32px;margin:0 -6px;padding:0 6px;
 border-radius:8px;text-align:left;color:var(--ink)}
.urow:hover{background:var(--hover)}
.urow .dim{margin-left:auto}
.umenu{position:absolute;left:8px;bottom:52px;z-index:30;background:var(--card);border:1px solid var(--line);
 border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:190px}
.umenu .hd{font-size:11.5px;color:var(--dim);padding:6px 10px 2px}
.umenu .tmi{display:flex;align-items:center;gap:8px}
.umenu .chk{width:14px;flex:none;color:var(--accent);font-size:12px}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--hover);display:grid;place-items:center;
 font-size:10.5px;color:var(--dim);font-weight:600;flex:none}
.rail-foot .dim{color:var(--dim);font-size:12px;margin-left:auto}

/* ---------- 中间（顶栏对照 Claude Code 会话视图：标题 + 目录 chip + 右侧动作） ---------- */
.mid{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.topbar{flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 18px}
.tb-ico{color:var(--dim);display:grid;place-items:center;flex:none}
.tb-ico svg{width:15px;height:15px}
.tb-title{font-size:13.5px;font-weight:500;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 cursor:pointer;border-radius:6px;padding:2px 6px;margin-left:-4px}
.tb-title:hover{background:var(--hover)}
.tb-rename{border:1px solid var(--accent);border-radius:6px;background:var(--card);
 color:var(--ink);padding:2px 6px;min-width:220px}
.tb-rename:focus{outline:none}
.tb-conn{margin-left:auto;flex:none;font-size:12px;color:var(--dim)}
.tb-conn.bad{color:var(--danger)}
.tb-btn{flex:none;font-size:12.5px;color:var(--dim);height:26px;padding:0 10px;border-radius:6px;background:transparent}
.tb-btn:hover{background:var(--hover);color:var(--ink)}
.tb-btn:disabled{opacity:.45;cursor:default}
.tb-btn:disabled:hover{background:transparent;color:var(--dim)}
.tb-btn.danger{color:var(--danger)}
/* chip：仓库 chip 的样子；目录 chip 在顶栏与输入卡上方各一处，同一个东西 */
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:6px;
 background:var(--hover);color:var(--ink);font-size:12.5px;border:0;max-width:240px;cursor:pointer}
.chip:hover{background:var(--active)}
.chip .icw svg{width:13px;height:13px;color:var(--dim)}
.chip .ct{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.empty .ct{color:var(--dim)}

.stream{flex:1;min-height:0;overflow-y:auto}
.col{max-width:46rem;margin:0 auto;padding:20px 24px 16px}
/* 空态：居中问候（衬线，对照 claude.ai/new）+ Sessions 风格近期任务（对照 Claude Code 主页） */
.home{max-width:46rem;margin:0 auto;padding:40px 24px 24px;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.home[hidden]{display:none}
.hello{margin:0;font:400 28px/1.2 var(--serif);letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:10px}
.hello .icw svg{width:24px;height:24px;color:var(--accent);stroke-width:2.2}
.sess-h{font-size:13px;color:var(--dim);margin:44px 0 8px}
.srow{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:8px;background:var(--ucard);
 margin-bottom:6px;cursor:pointer;font-size:13px;width:100%;text-align:left}
.srow:hover{background:var(--hover)}
.spill{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--accent)}
.spill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.spill.ok{color:var(--dim)}
.spill.bad{color:var(--danger)}
.stitle{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.sprev{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.sdir,.stime{flex:none;color:var(--dim);font-size:12px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.schev{flex:none;color:var(--dim);display:grid}
.schev svg{width:14px;height:14px}
.sess-empty{color:var(--dim);font-size:13px;padding:8px 0}

.msg-you{background:var(--ucard);border:1px solid var(--line);border-radius:12px;padding:12px 16px;max-width:85%;
 margin:18px 0 10px;white-space:pre-wrap;word-break:break-word}
.msg-zs{margin:14px 0 22px}
.zs-body{font-family:var(--serif);font-size:16px;line-height:1.85;
 white-space:pre-wrap;word-break:break-word}
.msg-sys{margin:10px 0;font-size:13px;color:var(--dim)}
/* 中途插话：旁白样式——稍缩进、左竖线、次要底色，与主线区分 */
.msg-aside{margin:8px 0 8px 20px;padding:6px 12px 7px;border-left:2px solid var(--dim);
 background:var(--code);border-radius:0 8px 8px 0;max-width:85%}
.msg-aside.you{border-left-color:var(--accent)}
.msg-aside .aw{font-size:11.5px;color:var(--dim);margin-bottom:2px}
.msg-aside .at{font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
/* 御史札记：回复下方一行可折叠 */
.cen{margin:8px 0 4px}
.cen-h{font-size:12.5px;color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:3px 10px;background:transparent}
.cen-h:hover{background:var(--hover)}
.cen-b{margin-top:6px;border-left:2px solid var(--warn);padding-left:10px}
.cen-i{font-size:12.5px;color:var(--ink);padding:2px 0;word-break:break-word}
.cen-i b{font-weight:600;color:var(--warn);margin-right:6px}
.cen-i .dim{color:var(--dim);margin-right:6px}
.msg-sys.bad{color:var(--danger)}
.retry-btn{margin-left:10px;font-size:12.5px;color:var(--danger);border:1px solid var(--danger);
 border-radius:8px;padding:1px 10px;background:transparent;vertical-align:1px;white-space:nowrap}
.retry-btn:hover{background:var(--danger-soft)}
.retry-btn:disabled{opacity:.45;cursor:default}
.retry-btn:disabled:hover{background:transparent}

.evid{margin:0 0 10px}
.evid-h{font-size:12.5px;color:var(--dim);border:1px solid var(--line);
 border-radius:8px;padding:3px 10px}
.evid-h:hover{background:var(--hover);color:var(--ink)}
.evid-b{margin-top:6px;border-left:2px solid var(--line);padding-left:10px}
.evid-i{font-size:12.5px;color:var(--dim);padding:2px 0;word-break:break-all}
.mono{font-family:var(--mono)}

/* 明细里的过程/原文小标题 */
.blk-cap{font-size:11.5px;color:var(--dim);letter-spacing:.08em;margin:6px 0 4px}
.tl{font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--ink);padding:1px 0}
.tl.tool,.tl.dim{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl.dim{color:var(--dim)}
.tl.txt{white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.tl.bad{color:var(--danger)}
.paytext{margin:0;font-family:var(--mono);font-size:12px;line-height:1.7;
 white-space:pre-wrap;word-break:break-word;background:var(--code);border-radius:8px;
 padding:10px 12px;max-height:420px;overflow-y:auto;overflow-x:auto}
.split{margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.split-f{font-weight:600;font-size:13px;margin-bottom:4px}
.split-f.skip{color:var(--dim);font-weight:500}   /* 跳过：灰掉，不是告警 */
.split-r{display:flex;gap:8px;font-size:12.5px;padding:2px 0}
.split-w{flex:none;color:var(--dim);min-width:52px}
.split-v{min-width:0;word-break:break-word;white-space:pre-wrap}

/* 输入区（对照 Claude Code 主页：chip 行 → 输入卡（placeholder + ⏎）→ 底行 + 与「模型 · 强度」） */
.composer{flex:none;padding:6px 24px 16px;background:var(--bg)}
.notice{max-width:46rem;margin:0 auto 6px;font-size:12.5px;color:var(--dim);min-height:17px}
.notice.bad{color:var(--danger)}
.cwrap{position:relative;max-width:46rem;margin:0 auto}
.chips-top{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;
 display:flex;align-items:flex-end}
.card:focus-within{border-color:var(--dim)}
.card textarea{flex:1;min-width:0;display:block;border:0;background:transparent;resize:none;
 min-height:42px;max-height:220px;line-height:1.6;font-size:14px;padding:10px 8px 10px 12px;
 outline:none;color:var(--ink)}
.send{flex:none;width:30px;height:30px;margin:6px 6px 6px 0;border-radius:6px;color:var(--dim);
 display:grid;place-items:center;background:transparent}
.send svg{width:15px;height:15px}
.send.ready{color:var(--accent)}
.send:hover{background:var(--hover)}
.send:disabled{color:var(--line);cursor:default;background:transparent}
.crow{display:flex;align-items:center;gap:8px;padding:8px 2px 0;font-size:12.5px;color:var(--dim)}
.plusbtn{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--dim)}
.plusbtn:hover{background:var(--hover);color:var(--ink)}
.plusbtn svg{width:14px;height:14px;stroke-width:1.8}
.sp{flex:1}
.modelsel{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 6px;border-radius:6px;
 color:var(--ink);font-size:12.5px}
.modelsel:hover{background:var(--hover)}
.modelsel .dim{color:var(--dim)}

.pop{position:absolute;bottom:calc(100% + 8px);left:0;z-index:40;background:var(--card);
 border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;
 min-width:340px;max-width:calc(100vw - 380px)}
.pop-hd{font-size:12px;color:var(--dim);margin-bottom:8px}
.seatrow{display:flex;align-items:center;gap:8px;margin:6px 0}
.seatrow .sname{flex:none;width:52px;font-size:13px}
.seatgrp{margin:6px 0}
.seatgrp .seatrow{margin:0}
.seat-act{margin:3px 0 0 60px;font-size:11.5px;color:var(--dim)}
.f-engine,.f-effort{border:1px solid var(--line);border-radius:8px;padding:4px 6px;
 background:var(--card);color:var(--ink)}
.f-model{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:4px 8px;
 background:var(--card);color:var(--ink)}
.f-model:focus,.f-engine:focus,.f-effort:focus{outline:none;border-color:var(--accent)}
.pop-ft{display:flex;justify-content:flex-end;margin-top:8px}
.okbtn{font-size:13px;border:1px solid var(--accent);color:var(--accent);
 border-radius:8px;padding:4px 14px}
.okbtn:hover{background:var(--accent);color:var(--accent-ink)}
.mrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer}
.mrow:hover{background:var(--hover)}
.mrow input{accent-color:var(--accent)}
.mrow.off{color:var(--dim);cursor:default}
.mrow.off:hover{background:transparent}
.mnote{margin-left:auto;font-size:12px;color:var(--dim)}
.addmx{font-size:12.5px;color:var(--accent);border:1px dashed var(--accent);border-radius:999px;
 padding:4px 12px;margin-top:8px}
.addmx:hover{background:var(--hover)}
.addmx:disabled{color:var(--dim);border-color:var(--line);cursor:default;background:transparent}
.rmbtn{flex:none;font-size:12px;color:var(--dim);border:1px solid var(--line);
 border-radius:8px;padding:3px 8px}
.rmbtn:hover{color:var(--danger);border-color:var(--danger)}
.slash-i{display:flex;gap:10px;width:100%;text-align:left;padding:7px 10px;
 border-radius:8px;align-items:baseline}
.slash-i.on{background:var(--hover)}
.slash-i b{font-weight:500;font-family:var(--mono);font-size:13px}
.slash-i span{color:var(--dim);font-size:12.5px;flex:1;min-width:0;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dec{margin:12px 0 4px}
.dec-card{border:1px solid var(--line);border-radius:12px;background:var(--card);
 padding:10px 14px;margin:8px 0}
.dec-q{font-weight:500;margin-bottom:8px}
.dec-opts{display:flex;flex-wrap:wrap;gap:8px}
.dec-o{border:1px solid var(--line);border-radius:999px;padding:5px 14px;
 font-size:13px;background:transparent}
.dec-o:hover{background:var(--hover)}
.dec-o.sel{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.dec-o.other{color:var(--dim);border-style:dashed}
.dec.done .dec-o,.dec-card.done .dec-o{opacity:.55;cursor:default}
.dec.done .dec-o:hover,.dec-card.done .dec-o:hover{background:transparent}
.dec.done .dec-o.sel,.dec-card.done .dec-o.sel{opacity:1}
.dec-in{margin-top:8px}
.dec.done .dec-in,.dec-card.done .dec-in{display:none}
.dec-inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 10px;
 background:var(--card);color:var(--ink)}
.dec-inp:focus{outline:none;border-color:var(--accent)}
.dec-o:disabled{opacity:.55;cursor:default}

<script>
'use strict';
/* ---------- 基础 ---------- */
const $=id=>document.getElementById(id);
const GETJ=async p=>{const r=await fetch(p);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
const POSTJ=(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
async function errOf(r){let m='';try{m=((await r.json())||{}).error||''}catch(_){}return m||('HTTP '+r.status)}
const API=id=>'/api/tasks/'+encodeURIComponent(id);
const NAMES={zhongshu:'中书省',menxia_1:'门下甲',menxia_2:'门下乙',menxia_3:'门下丙',menxia_4:'门下丁',shangshu:'尚书省',executor:'执行体',yushi:'御史'};
const roleCN=r=>NAMES[r]||(String(r).indexOf('executor:')===0?'执行体 '+r.slice(9):r);
const PHASE_CN={reading:'在办',executing:'在办',censoring:'在办',queued:'排队',compacting:'压缩中',waiting_answer:'等你答',
  waiting_contract:'等你批',waiting_changes:'等改动决定',idle:'等你说',done:'完成',failed:'失败',interrupted:'中断',stopped:'已停止'};
const RUNNING=p=>['reading','executing','censoring','queued','compacting'].indexOf(p)>=0;
const WAITING=p=>String(p||'').indexOf('waiting_')===0;
const TERMINAL=p=>['done','failed','interrupted','stopped'].indexOf(p)>=0;
const MODEL_CN=[[/^claude-opus-5/i,'Opus 5'],[/^claude-fable-5/i,'Fable 5'],[/^claude-sonnet-5/i,'Sonnet 5'],[/^claude-haiku-4-5/i,'Haiku 4.5']];
function modelCN(raw){const s=String(raw||'').trim();if(!s)return '';for(const [re,n] of MODEL_CN)if(re.test(s))return n+(/\[1m\]/i.test(s)?' · 1M':'');return s}
let MODELS={claude:[],codex:[]};                  /* 下拉清单：/api/projects.models，条目 {id,label,efforts?} */
const modelKey=x=>String(x==null?'':x).trim().toLowerCase().replace(/\[[^\]]*\]/g,'');
function modelMatch(req,act){const a=modelKey(req),b=modelKey(act);if(!a||!b)return true;return a===b||a.indexOf(b)>=0||b.indexOf(a)>=0}
function seatModelCN(engine,id){const s=String(id||'');if(!s)return '';const m=(MODELS[engine]||[]).find(x=>x.id===s);return (m&&m.label)||modelCN(s)}
const oneline=s=>String(s==null?'':s).replace(/\s+/g,' ');
function el(tag,cls,text){const d=document.createElement(tag);if(cls)d.className=cls;if(text!==undefined)d.textContent=text;return d}
const ICON={folder:'<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  more:'<svg class="fil" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
  chev:'<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',up:'<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>'};
function ic(n){const w=el('span','icw');w.innerHTML=ICON[n]||'';return w}
const baseName=p=>(String(p||'').split('/').filter(Boolean).pop())||String(p||'');
let HOME='',BASE='';                                /* BASE：一级目录（起服务时给的项目根），目录弹层从它开始 */
const abbr=p=>{p=String(p||'');return HOME&&(p===HOME||p.indexOf(HOME+'/')===0)?'~'+p.slice(HOME.length):p};
const J=x=>JSON.stringify(x,null,1);
const hms=t=>{const d=new Date(t*1000);return [d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':')};
const secsCN=s=>s==null?'':s<60?(Math.round(s*10)/10)+'s':s<3600?Math.floor(s/60)+'m'+Math.round(s%60)+'s':Math.floor(s/3600)+'h'+Math.floor(s%3600/60)+'m';

/* ---------- 状态 ----------
   多任务并行：当前任务是客户端选的（SEL）。每个任务一份 ctx：事件流水 evs（按 seq 续拉）+ 最近一份 summary。
   屏上只画 SEL；其它任务只在侧栏用 /api/tasks 的 phase 点圆点。 */
const streamEl=$('stream'),colEl=$('col'),say=$('say'),btnSend=$('btnSend'),btnStop=$('btnStop');
let TASKS=[],railQ='',SEL=null,cur={id:null,title:'',root:''};
const CTX=new Map();
let DEFSEATS={},cfg={mode:3,seats:null,auto:false,perm:'edits'};       /* seats 为 null = 用后端默认席位 */
let PENDROOT='';                               /* 没选任务时目录 chip 指的目录：首句建任务用它 */
/* 手机端（≤900px）：列表 → 任务 两层；往来是整屏弹层。桌面三栏照旧 */
let HOSTN='',railFilter='all';
const MQ=matchMedia('(max-width:900px)');const isMobile=()=>MQ.matches;
function showTask(on){document.body.classList.toggle('m-task',!!on);if(on)flowResized()}
function openFlow(){Z.wasMin=flowCol.classList.contains('min');flowCol.classList.remove('min');document.body.classList.add('m-flow');Z.overview=true;Z.dirty=true;flowResized()}
function closeFlow(){document.body.classList.remove('m-flow');if(Z.wasMin){flowCol.classList.add('min');Z.wasMin=false}}   /* 桌面存的折叠状态不动 */
function paintMach(bad){const m=$('mach');m.classList.toggle('bad',!!bad);$('machT').textContent=(HOSTN||'本机')+' · '+(bad?'离线，重连中…':'在线')}
const TKEY='aos_lasttask';
const lastTask=()=>{try{return localStorage.getItem(TKEY)||''}catch(_){return ''}};
const saveLastTask=id=>{try{if(id)localStorage.setItem(TKEY,id);else localStorage.removeItem(TKEY)}catch(_){}};
function ctxOf(id){id=String(id);let c=CTX.get(id);if(!c){c={id,evs:[],seq:0,sum:null,pulling:false};CTX.set(id,c)}return c}
const sumOf=id=>{const c=id?CTX.get(String(id)):null;return (c&&c.sum)||TASKS.find(t=>String(t.id)===String(id))||null};
const phaseOf=id=>{const s=sumOf(id);return s?s.phase:''};
const curSeats=()=>cfg.seats||DEFSEATS;

let noticeTimer=null;
function notice(t,bad){const n=$('notice');n.textContent=t||'';n.classList.toggle('bad',!!bad);
  clearTimeout(noticeTimer);if(t)noticeTimer=setTimeout(()=>{n.textContent='';n.classList.remove('bad')},6000)}
function setConn(t,bad){paintMach(bad);const c=$('conn');c.textContent=t;c.classList.toggle('bad',!!bad)}
function setTitle(t){cur.title=t||'';const box=$('tbTitle');if(box.querySelector('input'))return;
  box.textContent=cur.title||(cur.id?'（未命名）':'还没开任务')}
function showHome(v){$('home').hidden=!v}
function paintDir(){const has=!!cur.root;
  [['tbDir','tbDirT'],['cDir','cDirT']].forEach(([bid,tid])=>{const b=$(bid),t=$(tid);
    b.classList.toggle('empty',!has);t.textContent=has?baseName(cur.root):'选择目录…';b.title=has?abbr(cur.root):'选一个目录作为工作区'})}
/* 顶栏按钮与输入框提示跟着当前任务的阶段走 */
function paintPhase(){
  const ph=SEL?phaseOf(SEL):'';
  const run=RUNNING(ph),wait=WAITING(ph);
  say.placeholder=run?'链路在跑，这句会插给中书':ph==='waiting_answer'?'回答上面的问题，或直接说':'说一件事，或问一个问题';
  btnStop.disabled=!SEL||TERMINAL(ph)||!ph;btnStop.classList.toggle('danger',run||wait);
  const s=SEL?sumOf(SEL):null;$('btnCompact').disabled=!(s&&s.can_compact);
  $('mmStop').disabled=btnStop.disabled;$('mmCompact').disabled=$('btnCompact').disabled;
  paintRail();paintGate();
}
/* 流程条：这一轮的三省六部按链路顺序排一行，勾了的、跑着的、等你的一眼分清；点它打开往来 */
let railKey='';
function paintRail(){
  const wrap=$('prail'),box=$('prailRs');
  const s=SEL?sumOf(SEL):null;if(!s||!s.turn){wrap.hidden=true;railKey='';return}
  const evs=curEvs(),turn=s.turn,ph=s.phase||'';
  const st=evs.filter(e=>e.kind==='step'&&e.turn===turn);const att=Math.max(0,...st.map(e=>e.attempt||0));
  const cur=st.filter(e=>(e.attempt||0)===att);
  const stat=(role,steps)=>{const xs=cur.filter(e=>e.role===role&&steps.indexOf(e.step)>=0);if(!xs.length)return '';const l=xs[xs.length-1];return l.status==='started'?'run':l.status==='completed'?'ok':'bad'};
  const gateSt=g=>{const gi=evs.map((e,i)=>e.kind==='gate'&&e.gate===g&&e.turn===turn?i:-1).filter(i=>i>=0).pop();

  const grp=el('div','dec');if(!enabled)grp.classList.add('done');

      const text=single?picks[0]:list.map((d,i)=>(d.q||'')+'：选 '+picks[i]).join('；');

let chatKey='';
function renderChat(force){
  const v=view(),ph=at==null?(phaseOf(SEL)||phaseAt(v)):phaseAt(v);
  const key=SEL+':'+v.length+':'+(v.length?v[v.length-1].seq:0)+':'+ph+':'+at;
  if(!force&&key===chatKey)return;chatKey=key;
  const pin=streamEl.scrollHeight-streamEl.scrollTop-streamEl.clientHeight<80;
  colEl.textContent='';
  if(!SEL){showHome(true);return}
  showHome(false);
  /* 每轮只认最后一次 attempt 的原话（插话已并进去了）；作废读法的回话折成旁白 */
  const lastAtt={};v.forEach(e=>{if(e.kind==='message'&&e.what==='words')lastAtt[e.turn]=e.attempt});
  const stale=e=>lastAtt[e.turn]!=null&&(e.attempt||0)<lastAtt[e.turn];
  const lastGate=v.slice().reverse().find(e=>e.kind==='gate');
  const live=at==null;
  let phaseSoFar='';
  v.forEach((e,i)=>{
    if(e.kind==='task'){if(e.phase)phaseSoFar=e.phase;if(e.phase==='interrupted')addSys('程序重启过，这一轮中断了。再说一句就接着来。',true);return}
    if(e.kind==='message'&&e.who==='user'&&e.what==='words'){if(!stale(e))addYou(e.text);return}
    if(e.kind==='message'&&e.who==='zhongshu'&&e.what==='summary'){pushCol(evidBox('更早的对话已压成摘要',[e.text]));return}
    if(e.kind==='message'&&e.who==='zhongshu'){
      if(stale(e)){addAside('zs','中书 · 这次读法作废（你又补了话）',e.text);return}
      const gateIsMine=g=>lastGate&&lastGate.seq>e.seq&&!v.slice(i+1).some(x=>x.kind==='message'&&x.who==='zhongshu'&&x.seq<lastGate.seq&&x.seq>e.seq);
      const answered=v.slice(i+1).some(x=>x.kind==='action'&&x.action==='answer');
      const approved=v.slice(i+1).some(x=>x.kind==='action'&&x.action==='approve'&&x.turn===e.turn&&x.attempt===e.attempt);
      const spokeAfter=v.slice(i+1).some(x=>x.kind==='message'&&x.what==='words');
      const same=x=>x.turn===e.turn&&x.attempt===e.attempt;
      const st=v.slice(0,i).reverse().find(x=>x.kind==='step'&&x.role==='zhongshu'&&x.status==='completed'&&same(x)&&x.step===(e.what==='delivery'?7:3));
      const st0=st&&v.find(x=>x.kind==='step'&&x.status==='started'&&x.seq===st.started);
      const evid=st?{skills:(st0&&st0.inputs&&st0.inputs.skills)||[],reads:st.reads||[]}:null;
      const verdicts=v.slice(0,i).filter(x=>x.kind==='step'&&x.step===2&&x.status==='completed'&&same(x)).map(x=>({role:x.role,verdict:(x.output||{}).verdict||'?'}));
      addZs(e,{answer:live&&ph==='waiting_answer'&&lastGate&&lastGate.gate==='question'&&gateIsMine()&&!answered,
        contract:live&&ph==='waiting_contract'&&lastGate&&lastGate.gate==='contract'&&gateIsMine(),
        contractState:approved?'approved':spokeAfter?'void':''},evid,verdicts);
      return}
    if(e.kind==='action'&&e.action==='answer'){if(e.auto)addAside('you','自动档 · 替你答了',e.text);else addYou(e.text);return}
    if(e.kind==='action'&&e.action==='approve'&&e.auto){addSys('自动档：合同自动批准，尚书开工。');return}
    if(e.kind==='action'&&e.action==='interject'){
      if(['executing','queued','waiting_changes','censoring','compacting'].indexOf(phaseSoFar)>=0)addAside('you','你 · 插话（下一轮再算）',e.text);return}
    if(e.kind==='action'&&e.action==='stop'){addSys('你停止了任务。');return}
    if(e.kind==='action'&&(e.action==='adopt'||e.action==='revert')){addSys(e.action==='adopt'?(e.auto?'自动档：御史无偏离，改动自动采纳。':'你采纳了这些改动。'):'你撤回了这些改动'+(e.text?'：'+e.text:'')+'。');return}
    if(e.kind==='step'&&e.role==='shangshu'&&e.step===4&&e.status==='completed'&&!stale(e)){addShangshu(e.output||{});return}
    if(e.kind==='step'&&e.role==='yushi'&&e.status==='completed'){const o=e.output||{};const dev=(o.deviations||[]).filter(d=>d&&(typeof d==='string'||d.state==='filled'));
      if(!dev.length){addSys('御史：'+(o.summary||'已核过'));return}
      const wrap=el('div','cen');const h=el('button','cen-h','御史 · '+dev.length+' 处偏差'+(o.summary?' · '+oneline(o.summary):''));h.type='button';
      const box=el('div','cen-b');box.hidden=true;
      dev.forEach(d=>{const it=el('div','cen-i');it.appendChild(el('span','',typeof d==='string'?d:Object.entries(d).map(([k,vv])=>k+'：'+oneline(vv)).join(' · ')));box.appendChild(it)});
      h.onclick=()=>{box.hidden=!box.hidden};wrap.appendChild(h);wrap.appendChild(box);pushCol(wrap);return}
    if(e.kind==='changes'&&e.stage==='result'){
      if(e.note)addSys(e.note,true);
      const dec=v.slice(i+1).find(x=>x.kind==='action'&&(x.action==='adopt'||x.action==='revert'));
      pushCol(makeChanges(e,dec?dec.action:'',live&&ph==='waiting_changes'&&lastGate&&lastGate.changes===e.seq));return}
    if(e.kind==='error'){addFail(e.text,e.where==='chain');return}
  });
  if(live){
    if(ph==='reading')addSys(cfg.mode===1?'中书在读你的话…':'门下和中书在各自读你的话…');
    else if(ph==='queued')addSys('排队：同一仓库另一个任务还在执行。');
    else if(ph==='executing'){const st=v.filter(e=>e.kind==='step'&&e.step>=4&&e.step<=6&&e.turn===(sumOf(SEL)||{}).turn);
      const ex=st.filter(e=>e.role.indexOf('executor:')===0),done=ex.filter(e=>e.status==='completed').length,total=new Set(ex.map(e=>e.role)).size;
      addSys(st.some(e=>e.role==='shangshu'&&e.step===4&&e.status==='completed')?('执行中：'+total+' 个节点，完成 '+done+' 个'):'执行中：尚书在出计划…')}
    else if(ph==='censoring')addSys('御史在逐项核…');
    else if(ph==='compacting')addSys('压缩中…');
  }
  if(pin||force)streamEl.scrollTop=streamEl.scrollHeight;
}

function renderDir(){

/* ==================== 往来：照 zoetrope ====================
   世界坐标是字符格（cell）。框：主框 30×7、子框 26×6；兄弟横距 4、层距 6（多 1 行给框下的工具行）。
   框四行：状态符号＋名字｜这一步做什么｜⚒ 工具数 · 最近工具｜状态词＋耗时（主框多一行：模型）。
   框下工具行：进行中的都列，已完成的留最新 3 个；成功后 2.5 秒内 text→subtle→muted 变灰，失败红色留 4 秒。
   时间轴按事件数等距；段＝用户真正说的话；标记 » 空档 ◆/◇ 段 ❋ 派出 ✗ 失败 │ 播放头。回放 8×，空档压缩：拐点 0.8s，对数尺度 0.6。 */
const CW=7.2,CH=15;                              /* 一格的像素：12px 等宽字 */
const MAIN_W=30,MAIN_H=7,SUB_W=26,SUB_H=6,GAP_X=4,GAP_Y=6;
const Z={boxes:new Map(),order:[],tl:[],eras:[],applied:0,cursor:-1,playing:false,speed:8,compress:true,follow:true,overview:true,
  zoom:1,cam:{x:0,y:0},sel:null,drag:null,acc:0,lastT:0,plan:null,dirty:true,pulse:0};
const boxKey=e=>e.role.indexOf('executor:')===0?e.role+'@'+e.turn:e.role;
const parentOf=role=>role==='zhongshu'?null:role.indexOf('executor:')===0?'shangshu':'zhongshu';
const TL_KINDS={message:1,step:1,tool:1,error:1,gate:1,action:1,changes:1};
function flowReset(){Z.boxes.clear();Z.order=[];Z.tl=[];Z.eras=[];Z.applied=0;Z.cursor=-1;Z.playing=false;Z.sel=null;Z.plan=null;Z.zoom=1;Z.cam={x:0,y:0};Z.overview=true;Z.dirty=true;
  $('zworld').querySelectorAll('.zb').forEach(n=>n.remove());$('zcap').textContent='';paintStatus()}
/* 时间轴：全量事件里挑出上轴的那些；段＝用户真正说的话 */
function indexTl(){const evs=curEvs();Z.tl=evs.filter(e=>TL_KINDS[e.kind]);Z.eras=[];Z.tl.forEach((e,i)=>{if(e.kind==='message'&&e.what==='words')Z.eras.push(i)})}
const cursorOf=seq=>{let i=-1;Z.tl.forEach((e,k)=>{if(e.seq<=seq)i=k});return i};
/* 世界：把事件按顺序并到 seq 为止；往回走就清掉重来 */
function applyUpTo(seq){const evs=curEvs();
  if(Z.applied>0&&evs[Z.applied-1].seq>seq){Z.boxes.clear();Z.order=[];Z.plan=null;Z.applied=0;$('zworld').querySelectorAll('.zb').forEach(n=>n.remove())}
  while(Z.applied<evs.length&&evs[Z.applied].seq<=seq){applyOne(evs[Z.applied]);Z.applied++}
  Z.dirty=true}
function flowApply(fresh){indexTl();if(at==null){applyUpTo(Infinity);Z.cursor=Z.tl.length-1}Z.dirty=true}
function applyOne(e){
  if(e.kind==='step'){
    const k=boxKey(e);let b=Z.boxes.get(k);
    if(!b){b={key:k,role:e.role,parent:parentOf(e.role),main:e.role==='zhongshu',status:'running',desc:'',tools:0,lastTool:'',chips:[],last:null,t0:e.t,secs:0,model:'',seq:e.seq,turn:e.turn};
      Z.boxes.set(k,b);Z.order.push(k)}
    if(e.status==='started'){b.status='running';b.last=e;b.t0=e.t;b.secs=0;b.error='';b.desc=descOf(e)}
    else{b.status=e.status==='completed'?'done':'failed';b.last=Object.assign({},b.last||{},e);b.secs=e.secs||0;b.model=e.model||b.model;b.error=e.error||'';
      if(e.role==='shangshu'&&e.step===4&&e.status==='completed')Z.plan=e.output||null;
      if(e.status==='completed'&&e.step===2&&(e.output||{}).verdict)b.desc=(e.label||'')+' · '+e.output.verdict;
      if(e.status==='completed'&&e.role==='yushi'){const n=((e.output||{}).deviations||[]).filter(d=>d&&(typeof d==='string'||d.state==='filled')).length;b.desc='御史 · '+(n?n+' 处偏差':'清')}
      b.chips.forEach(c=>{if(c.status==='running'){c.status='interrupted';c.t=e.t}})}
  }else if(e.kind==='tool'){
    const b=Z.boxes.get(boxKey(e));if(!b)return;
    if(e.status==='started'){b.tools++;b.lastTool=e.tool;b.chips.push({id:e.id,call:e.call,tool:e.tool,text:e.text,status:'running',secs:null,t:0})}
    else{const c=b.chips.find(x=>x.id===e.id&&x.call===e.call&&x.status==='running');
      if(c){c.status=e.status;c.secs=e.secs;c.t=e.t}
      const done=b.chips.filter(x=>x.status!=='running');while(done.length>3){const old=done.shift();b.chips.splice(b.chips.indexOf(old),1)}}
  }
}
function descOf(e){
  if(e.role.indexOf('executor:')===0){const id=e.role.slice(9);const n=Z.plan&&(Z.plan.nodes||[]).find(x=>x.id===id);return n?id+'：'+n.goal:e.label}
  return e.label||'';
}
/* 树形布局：子树宽度自下而上，父框居中在子框之上 */
function layout(){
  const kids=new Map();Z.order.forEach(k=>{const b=Z.boxes.get(k);const p=b.parent;if(!kids.has(p))kids.set(p,[]);kids.get(p).push(k)});
  const dim=b=>b.main?[MAIN_W,MAIN_H]:[SUB_W,SUB_H];
  const width=k=>{const b=Z.boxes.get(k);const cs=(kids.get(k)||[]).filter(c=>Z.boxes.has(c));const w=dim(b)[0];
    if(!cs.length)return w;const sum=cs.reduce((a,c)=>a+width(c),0)+GAP_X*(cs.length-1);return Math.max(w,sum)};
  const place=(k,x,y)=>{const b=Z.boxes.get(k);const [w,h]=dim(b);const W=width(k);b.w=w;b.h=h;b.x=x+(W-w)/2;b.y=y;
    const cs=(kids.get(k)||[]).filter(c=>Z.boxes.has(c));let cx=x+(W-(cs.reduce((a,c)=>a+width(c),0)+GAP_X*(cs.length-1)))/2;
    cs.forEach(c=>{place(c,cx,y+h+GAP_Y);cx+=width(c)+GAP_X})};
  const roots=Z.order.filter(k=>{const p=Z.boxes.get(k).parent;return !p||!Z.boxes.has(p)});
  let x=0;roots.forEach(r=>{place(r,x,0);x+=width(r)+GAP_X});
  if(Z.boxes.size===1){const b=Z.boxes.values().next().value;b.w=MAIN_W+6;b.h=MAIN_H+1}       /* 只有中书时放大居中 */
}
function bounds(){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;Z.boxes.forEach(b=>{x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h+4)});
  return Z.boxes.size?{x0,y0,x1,y1}:{x0:0,y0:0,x1:MAIN_W,y1:MAIN_H}}
function paintWorld(){
  layout();
  const world=$('zworld'),svg=$('zedges');
  const bb=bounds();
  svg.setAttribute('width',(bb.x1+2)*CW);svg.setAttribute('height',(bb.y1+2)*CH);
  let paths='';
  Z.boxes.forEach(b=>{
    const cs=Z.order.filter(k=>Z.boxes.get(k).parent===b.key).map(k=>Z.boxes.get(k));if(!cs.length)return;
    const px=(b.x+b.w/2)*CW,py=(b.y+b.h)*CH,busY=(b.y+b.h+GAP_Y-1.5)*CH;
    const xs=cs.map(c=>(c.x+c.w/2)*CW);const L=Math.min(px,...xs),R=Math.max(px,...xs);
    paths+=`<path d="M${px} ${py}V${busY}M${L} ${busY}H${R}"/>`;
    cs.forEach(c=>{const cx=(c.x+c.w/2)*CW,cy=c.y*CH;paths+=`<path d="M${cx} ${busY}V${cy-4}"/><path class="ah" d="M${cx-4} ${cy-6}L${cx} ${cy-1}L${cx+4} ${cy-6}Z"/>`});
  });
  svg.innerHTML=paths;
  const seen=new Set();
  Z.boxes.forEach(b=>{
    seen.add(b.key);
    let n=world.querySelector('.zb[data-k="'+CSS.escape(b.key)+'"]');
    if(!n){n=el('div','zb');n.dataset.k=b.key;['l1','l2','l3','l4','l5'].forEach(c=>n.appendChild(el('div',c)));n.appendChild(el('div','chips'));
      n.onclick=ev=>{ev.stopPropagation();Z.sel=b.key;Z.dirty=true;openDrawerStep(b)};world.appendChild(n)}
    n.style.left=b.x*CW+'px';n.style.top=b.y*CH+'px';n.style.width=b.w*CW+'px';n.style.height=b.h*CH+'px';
    n.className='zb '+b.status+(b.main?' main':'')+(Z.sel===b.key?' sel':'');
    const glyph=b.status==='running'?(Z.pulse?'●':'○'):b.status==='done'?'✓':'✗';
    n.children[0].textContent=glyph+' '+roleCN(b.role);
    n.children[1].textContent=b.desc;
    n.children[2].textContent='⚒ '+b.tools+(b.lastTool?' · '+b.lastTool:'');
    const secs=b.status==='running'?(tlNow()-b.t0):b.secs;
    n.children[3].textContent=(b.status==='running'?'running':b.status==='done'?'done':'failed')+' '+secsCN(Math.max(0,secs))+(!b.main&&b.model?' · '+modelCN(b.model):'');
    n.children[4].textContent=b.main&&b.h>=7?(b.model?modelCN(b.model):(b.last&&b.last.engine)||''):'';
    const ch=n.children[5];ch.textContent='';
    const tn=tlNow();
    b.chips.forEach(c=>{const age=tn-c.t;
      const cls=c.status==='running'?'run':c.status==='completed'?(age<0.8?'t1':age<2.5?'t2':'t3'):(age<4?'bad':'t3');
      const row=el('div','chip '+cls,'⚒ '+c.tool+(c.secs!=null?' '+secsCN(c.secs):'')+(c.status==='completed'?' ✓':c.status==='failed'?' ✗':c.status==='interrupted'?' ◌':''));row.title=c.text;ch.appendChild(row)});
  });
  world.querySelectorAll('.zb').forEach(n=>{if(!seen.has(n.dataset.k))n.remove()});
  if(Z.overview)fitAll();
  world.style.transform='translate('+Z.cam.x+'px,'+Z.cam.y+'px) scale('+Z.zoom+')';
  paintMini(bb);
}
function tlNow(){if(at==null)return Date.now()/1000;const e=Z.tl[Z.cursor];return e?e.t:0}   /* 时间轴时钟：实时＝现在，回放＝游标那一刻 */
function fitAll(){const cb=$('cboard'),bb=bounds();const W=cb.clientWidth,H=cb.clientHeight-64;
  const ww=(bb.x1-bb.x0+2)*CW,wh=(bb.y1-bb.y0+2)*CH;
  Z.zoom=Math.min(1.2,Math.max(isMobile()?0.3:0.55,Math.min(W/ww,H/wh)));   /* 手机屏窄：允许缩到 0.3 让整棵树进屏，细看靠双指 */
  Z.cam.x=(W-ww*Z.zoom)/2-(bb.x0-1)*CW*Z.zoom;Z.cam.y=Math.max(8,(H-wh*Z.zoom)/2)-(bb.y0-1)*CH*Z.zoom;
  if(ww*Z.zoom>W||wh*Z.zoom>H){                      /* 放不下：镜头对着最近在动的框 */
    let f=null;Z.order.forEach(k=>{const b=Z.boxes.get(k);if(b.status==='running'||!f)f=b});
    if(f){if(ww*Z.zoom>W)Z.cam.x=W/2-(f.x+f.w/2)*CW*Z.zoom;if(wh*Z.zoom>H)Z.cam.y=H/2-(f.y+f.h/2)*CH*Z.zoom}}}
function paintMini(bb){const c=$('zmini'),ctx=c.getContext('2d');c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;
  ctx.scale(devicePixelRatio,devicePixelRatio);const W=c.clientWidth,H=c.clientHeight;ctx.clearRect(0,0,W,H);
  const ww=(bb.x1-bb.x0+2)*CW,wh=(bb.y1-bb.y0+2)*CH,s=Math.min(W/ww,H/wh)*0.9,ox=(W-ww*s)/2-(bb.x0-1)*CW*s,oy=(H-wh*s)/2-(bb.y0-1)*CH*s;
  Z.boxes.forEach(b=>{ctx.fillStyle=b.status==='running'?'#e5c07b':b.status==='done'?'#6b7280':'#e06c75';ctx.fillRect(ox+b.x*CW*s,oy+b.y*CH*s,b.w*CW*s,b.h*CH*s)});
  const cb=$('cboard');ctx.strokeStyle='#61afef';ctx.lineWidth=1;
  ctx.strokeRect(ox+(-Z.cam.x/Z.zoom)*s,oy+(-Z.cam.y/Z.zoom)*s,cb.clientWidth/Z.zoom*s,(cb.clientHeight-64)/Z.zoom*s)}
/* 时间轴 */
const MARK={words:'◆',spawn:'❋',fail:'✗',gate:'▮',act:'▸',tool:'▪',changes:'±',done:'✓'};
function tlKind(e){if(e.kind==='message'&&e.what==='words')return 'words';if(e.kind==='step'&&e.status==='started')return 'spawn';
  if(e.kind==='error'||(e.kind==='step'&&e.status==='failed')||(e.kind==='tool'&&e.status==='failed'))return 'fail';
  if(e.kind==='gate')return 'gate';if(e.kind==='action')return 'act';if(e.kind==='changes')return 'changes';if(e.kind==='step')return 'done';return 'tool'}
function capOf(e){const who=e.role?roleCN(e.role):'';
  if(e.kind==='message'&&e.what==='words')return '✳ '+oneline(e.text);
  if(e.kind==='message')return '✳ 中书'+(e.what==='delivery'?'交付':e.what==='summary'?'摘要':'回话')+'：'+oneline(e.text).slice(0,80);
  if(e.kind==='step')return (e.status==='started'?'❋ 派出 ':e.status==='completed'?'✓ 完成 ':'✗ 失败 ')+(e.label||who)+(e.secs?' '+secsCN(e.secs):'')+(e.error?' — '+oneline(e.error).slice(0,80):'');
  if(e.kind==='tool')return '⚒ '+who+' '+e.tool+' '+(e.status==='started'?'…':(secsCN(e.secs)+(e.status==='completed'?' ✓':e.status==='failed'?' ✗':' ◌')))+'  '+oneline(e.text).slice(0,60);
  if(e.kind==='gate')return '▮ 等你：'+(e.gate==='question'?'回答问题':e.gate==='contract'?'批契约':'定改动');
  if(e.kind==='action')return '▸ 你：'+({answer:'回答',approve:'开工',adopt:'采纳',revert:'撤回',stop:'停止',interject:'插话'}[e.action]||e.action)+(e.text?' '+oneline(e.text).slice(0,60):'');
  if(e.kind==='changes')return '± 改动 '+(e.files||[]).length+' 个文件'+(e.note?' — '+e.note:'');
  if(e.kind==='error')return '✗ '+oneline(e.text).slice(0,100);return ''}
function paintTimeline(){
  const c=$('ztl'),ctx=c.getContext('2d');const W=c.clientWidth,H=c.clientHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);
  ctx.clearRect(0,0,W,H);const N=Z.tl.length;if(!N)return;
  const x=i=>10+(N>1?i/(N-1):0.5)*(W-20);
  ctx.font='11px ui-monospace,Menlo,monospace';ctx.textBaseline='middle';
  ctx.strokeStyle='#3a3f4a';ctx.beginPath();ctx.moveTo(8,14);ctx.lineTo(W-8,14);ctx.stroke();
  const done=Z.cursor;
  Z.tl.forEach((e,i)=>{const k=tlKind(e);const xi=x(i);
    if(k==='tool'||k==='done'){ctx.fillStyle=i<=done?'#5b6069':'#2f333b';ctx.fillRect(xi-1,12,2,4);return}
    ctx.fillStyle=k==='fail'?'#e06c75':k==='words'?(i<=done?'#61afef':'#3a4d66'):k==='spawn'?'#98c379':k==='gate'?'#e5c07b':'#8b90a0';
    ctx.textAlign='center';ctx.fillText(k==='words'?(i<=done?'◆':'◇'):MARK[k],xi,14);
    if(i>0&&e.t-Z.tl[i-1].t>=60){ctx.fillStyle='#5b6069';ctx.fillText('»',(xi+x(i-1))/2,14)}});
  if(done>=0){const xc=x(done);ctx.strokeStyle='#d7dae0';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(xc,3);ctx.lineTo(xc,25);ctx.stroke();
    ctx.fillStyle='#9aa0aa';ctx.textAlign=xc>W-60?'right':xc<60?'left':'center';ctx.fillText(hms(Z.tl[done].t),xc,H-6)}
  ctx.fillStyle='#5b6069';if(done>0){ctx.textAlign='left';ctx.fillText(hms(Z.tl[0].t),8,H-6)}if(done<N-1){ctx.textAlign='right';ctx.fillText(hms(Z.tl[N-1].t),W-8,H-6)}
}
function paintStatus(){
  const N=Z.tl.length,era=Z.eras.filter(i=>i<=Z.cursor).length,live=at==null;
  const tools=curEvs().filter(e=>e.kind==='tool'&&e.status==='started'&&(live||e.seq<=at)).length;
  $('zst').textContent=(Z.playing?'▶ PLAY '+Z.speed+'×':live?'● LIVE':'▮▮ PAUSE')+(Z.eras.length?'  段 '+era+'/'+Z.eras.length:'')+'  |  '+Z.boxes.size+' 角色 · '+tools+' 工具'+(Z.overview?' ⚡':'')+'  |  ? 帮助';
  $('zplay').textContent=Z.playing?'▮▮':'▶';
}
function setCursor(i){
  i=Math.max(0,Math.min(Z.tl.length-1,i));
  if(i>=Z.tl.length-1){goLive();return}
  at=Z.tl[i].seq;Z.cursor=i;applyUpTo(at);chatKey='';renderChat(true);paintGate();Z.dirty=true;
}
function goLive(){Z.playing=false;at=null;indexTl();applyUpTo(Infinity);Z.cursor=Z.tl.length-1;chatKey='';renderChat(true);paintGate();Z.dirty=true}
function delayTo(i){const a=Z.tl[i-1],b=Z.tl[i];if(!a||!b)return 0;let d=Math.max(0,b.t-a.t);
  if(Z.compress&&d>0.8)d=0.8+Math.log1p(d-0.8)*0.6;return d/Z.speed}
function tick(ts){
  requestAnimationFrame(tick);
  if(!Z.lastT)Z.lastT=ts;const dt=Math.min(0.25,(ts-Z.lastT)/1000);Z.lastT=ts;
  const p=Math.floor(ts/1000)%2;if(p!==Z.pulse){Z.pulse=p;Z.dirty=true}
  if(Z.playing){Z.acc+=dt;let moved=false;
    while(Z.cursor<Z.tl.length-1&&Z.acc>=delayTo(Z.cursor+1)){Z.acc-=delayTo(Z.cursor+1);Z.cursor++;moved=true}
    if(moved){at=Z.tl[Z.cursor].seq;applyUpTo(at);chatKey='';renderChat(true)}
    if(Z.cursor>=Z.tl.length-1)goLive();
    Z.dirty=true}
  if(ts-(Z.lastPaint||0)>250){let run=false;const tn=tlNow();Z.boxes.forEach(b=>{if(b.status==='running')run=true;b.chips.forEach(c=>{if(c.status==='running'||tn-c.t<4)run=true})});if(run){Z.dirty=true;Z.lastPaint=ts}}
  if(Z.dirty&&!flowCol.classList.contains('min')){Z.dirty=false;paintWorld();paintTimeline();paintStatus();
    const e=Z.tl[Z.cursor];$('zcap').textContent=e?hms(e.t)+' '+capOf(e):(SEL?'':'还没开任务')}
}
function flowResized(){Z.dirty=true}
/* 交互：拖时间轴、拖画布、滚轮缩放、键盘 */
const ztl=$('ztl');
function tlIndexAt(px){const W=ztl.clientWidth,N=Z.tl.length;if(!N)return -1;return Math.round((px-10)/(W-20)*(N-1))}
ztl.onmousedown=e=>{Z.playing=false;const r=ztl.getBoundingClientRect();setCursor(tlIndexAt(e.clientX-r.left));
  const mv=ev=>setCursor(tlIndexAt(ev.clientX-r.left));const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};
  addEventListener('mousemove',mv);addEventListener('mouseup',up)};
$('zplay').onclick=()=>togglePlay();
$('zlive').onclick=()=>goLive();
function togglePlay(){if(Z.playing){Z.playing=false}else{if(at==null&&Z.tl.length>1)setCursor(Z.eras.length?Z.eras[Z.eras.length-1]:0);if(at!=null){Z.playing=true;Z.acc=0}}Z.dirty=true}
const zc=$('zcanvas');
zc.onmousedown=e=>{if(e.target.closest('.zb'))return;Z.drag={x:e.clientX,y:e.clientY,cx:Z.cam.x,cy:Z.cam.y};Z.overview=false};
addEventListener('mousemove',e=>{if(!Z.drag)return;Z.cam.x=Z.drag.cx+e.clientX-Z.drag.x;Z.cam.y=Z.drag.cy+e.clientY-Z.drag.y;Z.dirty=true});
addEventListener('mouseup',()=>{Z.drag=null});
zc.addEventListener('wheel',e=>{e.preventDefault();Z.overview=false;
  if(e.ctrlKey||e.metaKey){const f=e.deltaY<0?1.1:0.9;const r=zc.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    Z.cam.x=mx-(mx-Z.cam.x)*f;Z.cam.y=my-(my-Z.cam.y)*f;Z.zoom=Math.max(0.2,Math.min(3,Z.zoom*f))}
  else{Z.cam.x-=e.deltaX;Z.cam.y-=e.deltaY}Z.dirty=true},{passive:false});
zc.onclick=e=>{if(!e.target.closest('.zb')){Z.sel=null;Z.dirty=true}};
/* 触摸：单指拖、双指缩放（围绕两指中点）；点框还是走 click */
let tch=null;
zc.addEventListener('touchstart',e=>{Z.overview=false;
  if(e.touches.length===1){const t=e.touches[0];tch={x:t.clientX,y:t.clientY,cx:Z.cam.x,cy:Z.cam.y}}
  else if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];tch={pinch:true,d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:Z.zoom}}},{passive:true});
zc.addEventListener('touchmove',e=>{if(!tch)return;e.preventDefault();
  if(tch.pinch&&e.touches.length===2){const a=e.touches[0],b=e.touches[1];const nz=Math.max(0.2,Math.min(3,tch.z*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/tch.d)),f=nz/Z.zoom;
    const r=zc.getBoundingClientRect(),mx=(a.clientX+b.clientX)/2-r.left,my=(a.clientY+b.clientY)/2-r.top;Z.cam.x=mx-(mx-Z.cam.x)*f;Z.cam.y=my-(my-Z.cam.y)*f;Z.zoom=nz;Z.dirty=true}
  else if(!tch.pinch&&e.touches.length===1){const t=e.touches[0];Z.cam.x=tch.cx+t.clientX-tch.x;Z.cam.y=tch.cy+t.clientY-tch.y;Z.dirty=true}},{passive:false});
zc.addEventListener('touchend',()=>{tch=null},{passive:true});
ztl.addEventListener('touchstart',e=>{Z.playing=false;const r=ztl.getBoundingClientRect();setCursor(tlIndexAt(e.touches[0].clientX-r.left))},{passive:true});
ztl.addEventListener('touchmove',e=>{e.preventDefault();const r=ztl.getBoundingClientRect();setCursor(tlIndexAt(e.touches[0].clientX-r.left))},{passive:false});
const HELP='空格 播/停 · [ ] 上一段/下一段 · End/g 回到实时 · s 空档压缩开关 · o 总览 · f 跟随 · r 重排 · ←→/Tab 选框 · Enter/i 看详情 · hjkl 平移 · + - 0 缩放 · c 居中 · Esc 关闭';
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(flowCol.classList.contains('min'))return;
  const k=e.key;const N=Z.tl.length;
  const jump=dir=>{const eras=Z.eras;if(!eras.length)return;let i;if(dir<0){const prev=eras.filter(x=>x<Z.cursor);i=prev.length?prev[prev.length-1]:eras[0]}else{const next=eras.filter(x=>x>Z.cursor);i=next.length?next[0]:N-1}Z.playing=false;setCursor(i)};
  if(k===' '||e.code==='Space'){e.preventDefault();togglePlay()}
  else if(k==='['){jump(-1)}else if(k===']'){jump(1)}
  else if(k==='End'||k==='g'){goLive()}
  else if(k==='ArrowLeft'&&e.shiftKey){Z.playing=false;setCursor(Z.cursor-1)}else if(k==='ArrowRight'&&e.shiftKey){Z.playing=false;setCursor(Z.cursor+1)}
  else if(k==='s'){Z.compress=!Z.compress;notice('空档压缩：'+(Z.compress?'开':'关'))}
  else if(k==='o'){Z.overview=true;Z.dirty=true}else if(k==='f'){Z.follow=!Z.follow;Z.overview=Z.follow;Z.dirty=true}else if(k==='r'||k==='c'){Z.overview=true;Z.dirty=true}
  else if(k==='h'){Z.cam.x+=40;Z.overview=false;Z.dirty=true}else if(k==='l'){Z.cam.x-=40;Z.overview=false;Z.dirty=true}
  else if(k==='j'){Z.cam.y-=40;Z.overview=false;Z.dirty=true}else if(k==='k'){Z.cam.y+=40;Z.overview=false;Z.dirty=true}
  else if(k==='+'||k==='='){Z.zoom=Math.min(3,Z.zoom*1.2);Z.overview=false;Z.dirty=true}else if(k==='-'){Z.zoom=Math.max(0.2,Z.zoom/1.2);Z.overview=false;Z.dirty=true}
  else if(k==='0'){Z.zoom=1;Z.overview=false;Z.dirty=true}
  else if(k==='ArrowLeft'||k==='ArrowRight'||k==='Tab'||k==='ArrowUp'||k==='ArrowDown'){if(!Z.order.length)return;e.preventDefault();
    const i=Z.order.indexOf(Z.sel);const d=(k==='ArrowLeft'||k==='ArrowUp')?-1:1;Z.sel=Z.order[(i+d+Z.order.length)%Z.order.length];Z.dirty=true}
  else if((k==='Enter'||k==='i')&&Z.sel){openDrawerStep(Z.boxes.get(Z.sel))}
  else if(k==='?'){notice(HELP)}
  else if(k==='Escape'){closeDrawer();closePops();closeMenus()}
});
if(window.ResizeObserver)new ResizeObserver(flowResized).observe($('cboard'));else addEventListener('resize',flowResized);

/* ---------- 起 ---------- */
initLayout();
(async()=>{
  try{const p=await GETJ('/api/projects');DEFSEATS=p.seats||{};HOME=p.home||'';BASE=p.default||'';HOSTN=p.host||'';if(p.models)MODELS=p.models;PENDROOT=(p.projects[0]&&p.projects[0].path)||p.default||'';
    const t0=await GETJ('/api/tasks');renderTasks(t0.tasks||[]);setConn('已连接',false);
    const lt=lastTask();if(lt&&TASKS.some(x=>String(x.id)===lt))await selectTask(lt);else await selectTask(null)}
  catch(err){setConn('后台没应答，等它起来',true);await selectTask(null)}
  /* 页面看不见就不轮询（手机切后台、桌面切标签）；手机上慢一档省电省流量 */
  setInterval(()=>{if(!document.hidden)loadTasks()},isMobile()?3000:2000);
  setInterval(()=>{if(SEL&&!document.hidden)pull(SEL)},isMobile()?2000:1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadTasks();if(SEL)pull(SEL)}});
  requestAnimationFrame(tick);
  if(!isMobile())say.focus();
})();
</script>
